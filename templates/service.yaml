apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tdarr.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "tdarr.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8265
      targetPort: web
